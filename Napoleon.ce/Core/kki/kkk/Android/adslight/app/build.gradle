apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.grsoft.ads"
        minSdkVersion 15
        targetSdkVersion 29
        versionCode 6
        versionName "3.1.1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        market {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }

        market {
            keyAlias 'grnpl'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('ADS_KEY'))
            storePassword 'GrSoftNapoleon'
        }

    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }

        market {
            signingConfig signingConfigs.market
        }
    }


    applicationVariants.all {
        variant ->
            if (variant.buildType.name == "release")
                variant.outputs.all {
                    outputFileName = "AdsLight.apk"
                }
            if (variant.buildType.name == "market")
                variant.outputs.all {
                    outputFileName = "AdsLightMarket.apk"
                }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.0'

    implementation project(':network')
    implementation project(':documents')
    implementation project(':adsbase')
}
