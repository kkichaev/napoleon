      function drawRoute(points, bounds) {
         var styleGPS = new YMaps.Style();
         styleGPS.lineStyle = new YMaps.LineStyle();
         styleGPS.lineStyle.strokeWidth = 4;
         styleGPS.lineStyle.strokeColor = 'ff0000ff';
         var styleGSM = new YMaps.Style();
         styleGSM.lineStyle = new YMaps.LineStyle();
         styleGSM.lineStyle.strokeWidth = 4;
         styleGSM.lineStyle.strokeColor = 'b000b0ff';

         var isGSM = null;
         var routes = [];

         points.forEach(function (p) {
            if (isGSM == null || isGSM != p.isGSM) {
               routes.push([]);
               isGSM = p.isGSM;
            }

            routes[routes.length - 1].push(p);
         });

         routes.forEach(function (p) {
            var path = [];
            var color = p.isGSM != 0 ? styleGPS : styleGSM;

            p.forEach(function (pp) {
               var c = new YMaps.GeoPoint(pp.longitude, pp.latitude);
               path.push(c);
               bounds.add(c);
            });

            var route = new YMaps.Polyline(path);
            route.setStyle(color);
            map.addOverlay(route);
            polylines.push(route);
         });
      }

      function humanTime(min) {
         return Math.round(min < 60) ? min + "&nbsp;мин." : Math.round(min / 60) + "&nbsp;ч.&nbsp;" + Math.round(min % 60) + "&nbsp;мин.";
      }

      function doStopDescr(obj) {
         var result = "Остановка ";
         var ds = new Date(obj.date);
         var de = new Date(obj.endTime);
         var dm = Math.round((de - ds) / (1000 * 60));
         result += "<br>";
         result += humanTime(dm);
         result += "<br>";
         result += obj.address;
         return result;
      }

      function drawStops(stops, bounds) {
         if (stops != null) {
            stops.forEach(function (p) {
               var point = new YMaps.GeoPoint(p.longitude, p.latitude);
               bounds.add(point);
               marker = new YMaps.Placemark(point);
               marker.setIconContent("<font color='blue'><b>P" + p.idx + "</b></font>");
               marker.description = doStopDescr(p);
               map.addOverlay(marker);

               markers[p.idx] = marker;
            });
         }
      }

      function taskSolutionToString(sol) {
         var res = "Неопределена";

         switch (sol) {
            case 0:
               res = "Непринята";
               break;
            case 1:
               res = "Выполнена";
               break;
            case 2:
               res = "Отклонена";
               break;
            case 4:
               res = "Принятая";
               break;
            case 5:
               res = "Выполняется";
               break;
         }

         return res;
      }

      function doDocDescr(d) {
         var res = d.task.client;
         res += "<br>" + d.task.address;

         return res;
      }

      function drawExecuted(docs, bounds) {
         if (docs != null) {
            docs.forEach(function (p) {
               if (p.task.latitude != 0 && p.task.longitude != 0) {
                  var point = new YMaps.GeoPoint(p.task.longitude, p.task.latitude);
                  bounds.add(point);
                  marker = new YMaps.Placemark(point, { style: "default#greenSmallPoint" });
                  marker.setIconContent("<font color='green'><b>" + p.idx + "</b></font>");
                  marker.description = doDocDescr(p);
                  map.addOverlay(marker);

                  markers[p.idx] = marker;
               }
            });
         }
      }

      function doPendDescr(d) {
         var res = "Задача:&nbsp;" + d.task.text;
         res += "<br>адрес:&nbsp;" + d.task.address;

         return res;
      }

      function drawPendings(docs, bounds) {
         if (docs != null) {
            docs.forEach(function (p) {
               if (p.task.latitude != 0 && p.task.longitude != 0) {
                  var point = new YMaps.GeoPoint(p.task.longitude, p.task.latitude);
                  bounds.add(point);
                  marker = new YMaps.Placemark(point, { style: "default#redSmallPoint" });
                  marker.setIconContent("<font color='red'><b>" + p.idx + "</b></font>");
                  marker.description = doPendDescr(p);
                  map.addOverlay(marker);

                  markers[p.idx] = marker;
               }
            });
         }
      }

      function doStepPointsDescr(d) {
         var dt = new Date(d.date);
         var res = "время:&nbsp;" + dt.getHours() + ":" + dt.getMinutes();
         res += "<br>скорость:&nbsp;" + Math.round(d.speed * 3.6) + "&nbsp;км/ч";

         return res;
      }

      function drawStepPoints(steps, bounds) {
         if (steps != null) {
            steps.forEach(function (p) {
               var point = new YMaps.GeoPoint(p.longitude, p.latitude);
               bounds.add(point);
               marker = new YMaps.Placemark(point, { style: "default#blueSmallPoint" });
               marker.setIconContent("<font color='blue'><b>" + p.idx + "</b></font>");
               marker.description = doStepPointsDescr(p);
               map.addOverlay(marker);
            });
         }
      }

      function drawUserLocation(docs, bounds) {
         docs.forEach(function (p) {
            var point = new YMaps.GeoPoint(p.location.longitude, p.location.latitude);
            bounds.add(point);
            marker = new YMaps.Placemark(point);
            marker.setIconContent("<font color='green'><b>" + p.pos + "</b></font>");
            marker.description = p.location.agent.name;
            map.addOverlay(marker);

            markers[p.pos] = marker;
         });

         map.setCenter(bounds.getCenter());
         map.setBounds(bounds);
      }

      function hasData(data) {
         return data != null &&
            (data.points != null && data.points.length > 0) ||
            (data.stops != null && data.stops.lenght > 0) ||
            (data.executed != null && data.executed.length > 0) ||
            (data.pendings != null && data.pendings.length > 0) ||
            (data.stepoints != null && data.stepoints.lenght > 0) ||
            (data.userlocation != null && data.userlocation.length > 0);
      }

      function loadData(json) {
         try {
            var data = JSON.parse(json)
            var bounds = new YMaps.GeoCollectionBounds();

            if (hasData(data)) {
               if (data.points != null)
                  drawRoute(data.points, bounds);

               if (data.stops != null)
                  drawStops(data.stops, bounds);

               if (data.executed != null)
                  drawExecuted(data.executed, bounds);

               if (data.pendings != null)
                  drawPendings(data.pendings, bounds);

               if (data.stepoints != null)
                  drawStepPoints(data.stepoints, bounds);

               if (data.stepoints != null)
                  drawUserLocation(data.userlocation, bounds);

               if (bounds._empty == 0) {
                  map.setCenter(bounds.getCenter());
                  map.setBounds(bounds);
               }
            } else {
               document.getElementById('map').style.display = 'none';
               document.write('Нет данных');
            }
         } catch (err) {
            console.log(err);
         }
      }
