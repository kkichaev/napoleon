<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:outputStylesheet library="css" name="style.css"  />
        <h1>Текущий пользователь: #{userBean.currentUser}</h1>
        <div>
        <h:messages/>
        <h:form>
            <h2>Войти</h2>
            <h:panelGrid columns="2">
                <h:outputLabel for="username" value="Пользователь:"/>
                <h:inputText id="username" value="#{userBean.username}"/>
                <h:outputLabel for="password" value="Пароль:"/>
                <h:inputText id="password" value="#{userBean.password}"/>
                <h:panelGroup/>
                <h:commandButton value="Создать" action="#{userBean.login}"/>
            </h:panelGrid>
        </h:form>
        <h:form>
            <h2>Новый пользователь</h2>
            <h:panelGrid columns="2">
                <h:outputLabel for="username" value="Пользователь:"/>
                <h:inputText id="username" value="#{userBean.username}"/>
                <h:outputLabel for="password" value="Пароль:"/>
                <h:inputText id="password" value="#{userBean.password}"/>
                <h:panelGroup/>
                <h:commandButton value="Создать" action="#{userBean.createUser}"/>
            </h:panelGrid>
        </h:form>
        </div>
        <h3>Список пользователей</h3>
        <h:form>
            <h:dataTable value="#{userBean.users}" var="u" border="1" cellspacing="0" cellpadding="10,0,0,10">
                <h:column>
                    <f:facet name="header">Логин</f:facet>
                    #{u.username}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Пароль</f:facet>
                    #{u.password}
                </h:column>
            </h:dataTable>
        </h:form>
    </h:body>
</html>
