apply plugin: 'com.android.application'


android {

    defaultConfig {
        applicationId "com.ashberrysoft.leadertask"
        minSdkVersion 21
        targetSdkVersion 26
        multiDexEnabled true
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        preDexLibraries = false
    }
    packagingOptions
    {
        exclude 'com.google.android.support/wearable/2.0.1/res/values-notround-v23'
    }
    compileSdkVersion = 26
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile 'com.google.android.support:wearable:2.4.0'
    compile 'com.google.android.gms:play-services-wearable:16.0.1'
    compile 'com.github.shell-software:fab:1.1.2'
    provided 'com.google.android.wearable:wearable:2.4.0'

}
