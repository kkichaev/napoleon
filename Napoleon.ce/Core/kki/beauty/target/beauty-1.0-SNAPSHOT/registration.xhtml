<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Регистрация</title>
    </h:head>
    <h:body>
        <h:form>
            <h:panelGrid columns="2">
                <h:outputLabel value="Логин" for="login"/>
                <h:inputText id="login" value="#{userController.user.login}"/>
                
                <h:outputLabel value="Пароль" for="password"/>
                <h:inputText id="password" value="#{userController.user.password}"/>
                
                <h:panelGroup/>
                <h:commandButton value="Сохранить" action="#{userController.save}"/>
            </h:panelGrid>
        </h:form>
    </h:body>
</html>
