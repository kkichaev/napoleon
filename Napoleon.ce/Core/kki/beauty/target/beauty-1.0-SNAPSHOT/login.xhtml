<!DOCTYPE html>
<html 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <h:head>
        <title>TODO supply a title</title>
    </h:head>
    <body>
        <h:form>
            <h:panelGrid columns="3">
                <h:outputText value="Логин"/>
                <h:inputText id="login" value="#{user.login}"/>
                <h:message for="login" style = "color:red" />
                
                <h:outputText value="Пароль"/>
                <h:inputText id="password" value="#{user.password}"/>
                <h:message for="password" style = "color:red" />
                
                <h:commandButton value="Submit" action="#{user.loginAction}" >
                    <f:ajax execute="login password" render="status"/>
                </h:commandButton>
            </h:panelGrid>
        </h:form>
        <h:outputText id="status" value="#{user.status}"/>
    </body>
</html>
