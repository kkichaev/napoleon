apply plugin: 'com.android.application'

android {
    compileSdkVersion 29

    defaultConfig {
        applicationId "com.grsoft.napoleon"
        minSdkVersion 15
        targetSdkVersion 29
        versionCode 17
        versionName "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        market {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        //abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }

        market {
            keyAlias 'grnpl'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('GRNPL_KEY'))
            storePassword 'GrSoftNapoleon'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }

        market {
            signingConfig signingConfigs.market
        }
    }

    applicationVariants.all {
        variant ->
            if (variant.buildType.name == "release" && variant.productFlavors[0].name.equals("apk1"))
                variant.outputs.all {
                    outputFileName = "frolov1.apk"
                }
            if (variant.buildType.name == "release" && variant.productFlavors[0].name.equals("apk2"))
                variant.outputs.all {
                    outputFileName = "frolov2.apk"
                }
            if (variant.buildType.name == "release" && variant.productFlavors[0].name.equals("apk3"))
                variant.outputs.all {
                    outputFileName = "frolov3.apk"
                }
            else if (variant.buildType.name == "market")
                variant.outputs.all {
                    outputFileName = "NapoleonMarketDev4.apk"
                }
    }

    flavorDimensions "version"
    productFlavors{
        apk1{
            dimension "version"
            applicationId "com.grsoft.napoleon1"
        }

        apk2{
            dimension "version"
            applicationId "com.grsoft.napoleon2"
        }

        apk3{
            dimension "version"
            applicationId "com.grsoft.napoleon3"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':base')

    implementation 'androidx.appcompat:appcompat:1.0.0'

}
