<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width,height=device-height, user-scalable=no"/>
   
  <title>OpenStreetMap</title>

  <style type="text/css">
    body, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #map {
      height: 100%;
    }
  </style>

  <script src="http://maps.googleapis.com/maps/api/js?key=AIzaSyAjuQiUAlecbUWCdh1QCnZzrWq37EPqPE0&callback=initialize" async defer></script>

  <script type="text/javascript">
    var map = null;
    var infowindow = null;
    var myPosition = null;
    var myCircle = null;
    var bounds = null;
    var points = null;
    
    function initialize() {
      var mapTypeIds = [];

      for(var type in google.maps.MapTypeId) {
        mapTypeIds.push(google.maps.MapTypeId[type]);
      }

      mapTypeIds.push("OSM");

      map = new google.maps.Map(document.getElementById("map"),{
        center: new google.maps.LatLng({ lat: 57.611453, lng: 39.83032 }),
        zoom: 13,
        mapTypeId: "OSM",
        mapTypeControlOptions: { mapTypeIds: mapTypeIds }
      });

      map.mapTypes.set("OSM", new google.maps.ImageMapType({
        getTileUrl: function (coord, zoom) { return "http://tile.openstreetmap.org/" + zoom + "/" + coord.x + "/" + coord.y + ".png"; },
        tileSize: new google.maps.Size(256, 256),
        name: "OpenStreetMap",
        maxZoom: 18
      }));
         
      data = 'DATASECTION';
      console.log("json data:");
      console.log(data);
      
      bounds = new google.maps.LatLngBounds();
      points = new google.maps.LatLngBounds();
         
      if (!loadData(data)){
        document.getElementById("map").style.visibility='hidden';
        document.getElementById("info").style.visibility='visible';
   	  }
    }
     
    function drawPoint(docs) {
      docs.forEach(function (p) {
        var c = new google.maps.LatLng(p.latitude, p.longitude);
        bounds.extend(c);
        points.extend(c);
        
        var marker = new google.maps.Marker({
          position: c,
          icon: "http://grsoft.ru/markers/shop.png",
          map: map,
          info: p,
        });

        new google.maps.Circle({
          strokeColor: 'red',
          strokeOpacity: 0.8,
          strokeWeight: 2,
          fillColor: 'red',
          fillOpacity: 0.35,
          map: map,
          center: c,
          radius: p.radius
        });
        
        marker.addListener('click', function (e) {
          if (infowindow != null)
            infowindow.close();

          infowindow = new google.maps.InfoWindow({
            content: '<b>' + this.info.name + '</b><br><i>' + this.info.address + '</>',
          });

          infowindow.open(map, this);
        });
      });
    }
      
    function loadData(json) {
      result = false;
      try {
        var data = JSON.parse(json)

        if (data.mypos != null){
          var c = new google.maps.LatLng(data.mypos.mLatitude, data.mypos.mLongitude);
          bounds.extend(c);
          myPosition = new google.maps.Marker({
            position: c,
            icon: "http://grsoft.ru/markers/nowpoint.png",
            map: map,
          });
          
          myCircle = new google.maps.Circle({
            strokeColor: 'blue',
            strokeOpacity: 0.8,
            strokeWeight: 2,
            fillColor: 'blue',
            fillOpacity: 0.35,
            map: map,
            center: c,
            radius: data.radius
          });
          
          result = true;
        }
    
        if (data != null && data.map != null  && data.map.length > 0) {
          drawPoint(data.map);
          result = true;
        }
        
        if (!bounds.isEmpty()) {
          map.setCenter(bounds.getCenter());
          map.fitBounds(bounds);
        }
           
      } catch (err) {
        console.log(err);
      }
       
      return result;
    }
    
    function setMyLocation(loc){
      if (myPosition != null)
      {
        var c = new google.maps.LatLng(loc.mLatitude, loc.mLongitude);
        myPosition.setPosition(c);
        myCircle.setCenter(c);
        
        var data = new google.maps.LatLngBounds();
        data = data.union(points)
        data.extend(c);
        map.setCenter(data.getCenter());
        map.fitBounds(data);
      }
    }
  </script>
</head>

<body>
   <div id="map"></div>
   <div id='info' style='position: absolute;left: 50%;top: 50%;transform: translateX(-50%) translateY(-50%);visibility: hidden'><font color='gray'>Нет данных о перемещении агента</font></div>
</body>
</html>
