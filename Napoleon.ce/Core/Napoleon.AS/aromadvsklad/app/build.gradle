apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.grsoft.napoleon.sklad"
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        //abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "version"
    productFlavors{
        aromadv {
            dimension "version"
            applicationId "com.grsoft.napoleon"
        }

        elitemarket{
            dimension "version"
        }
    }
    applicationVariants.all {
        variant ->
            def names = variant.productFlavors*.name
            if (variant.buildType.name == "release" && names.contains("aromadv")) {
                variant.outputs.all {
                    outputFileName = "AromaDVSklad.apk"
                }
            }
            if (variant.buildType.name == "release" && names.contains("elitemarket")) {
                variant.outputs.all {
                    outputFileName = "EliteMarketSklad.apk"
                }
            }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':tradebase')

    implementation 'androidx.appcompat:appcompat:1.0.0'

}
