apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.grsoft.napmobile"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 24
        versionName "23"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

//        market {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//        }
    }

    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        //abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }

//        market {
//            keyAlias 'grnpl'
//            keyPassword 'GrSoftNapoleon'
//            storeFile file(System.getenv('GRNPL_KEY'))
//            storePassword 'GrSoftNapoleon'
//        }
    }

	flavorDimensions "version"
    productFlavors{
        prod{
            dimension "version"
        }
        progtest {
            dimension "version"
        }
    }
    namespace 'com.grsoft.napmobile'

    buildTypes {
        debug {
//            manifestPlaceholders.access_background_location = "android.permission.ACCESS_BACKGROUND_LOCATION"
        }

        release {
            signingConfig signingConfigs.release
//            manifestPlaceholders.access_background_location = "android.permission.ACCESS_BACKGROUND_LOCATION"
        }

//        market {
//            signingConfig signingConfigs.market
//            manifestPlaceholders.access_background_location = "fake.name"
//        }
    }

    applicationVariants.all {
        variant ->
            if (variant.buildType.name == "release") {
				if(variant.productFlavors[0].name.equals("prod")) {
					variant.outputs.all {
						outputFileName = "AceTeam.apk"
					}
				}
				if(variant.productFlavors[0].name.equals("progtest")) {
					variant.outputs.all {
						outputFileName = "NapoleonTest.apk"
					}
				}
			}
//            if (variant.buildType.name == "market")
//                variant.outputs.all {
//                    outputFileName = "AceTeamMarket.apk"
//                }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':base')

    implementation 'androidx.appcompat:appcompat:1.1.0'
}
