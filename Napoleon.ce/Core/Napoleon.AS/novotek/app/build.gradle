apply plugin: 'com.android.application'

android {
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.grsoft.napoleon"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 22
        versionName "22"
        multiDexEnabled true
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        market {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        //abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }

        market {
            keyAlias 'grnpl'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('GRNPL_KEY'))
            storePassword 'GrSoftNapoleon'
        }
    }

    flavorDimensions "version"
    productFlavors{
        novotek{
            dimension "version"
            applicationId "com.grsoft.napoleon"
        }

        avix{
            dimension "version"
            applicationId "com.grsoft.npl2"
        }
        trade{
            dimension "version"
            applicationId "com.grsoft.npl3"
        }
    }


    buildTypes {
        debug {
            manifestPlaceholders.access_background_location = "android.permission.ACCESS_BACKGROUND_LOCATION"
        }

        release {
            signingConfig signingConfigs.release
            manifestPlaceholders.access_background_location = "android.permission.ACCESS_BACKGROUND_LOCATION"
        }

        market {
            signingConfig signingConfigs.market
            manifestPlaceholders.access_background_location = "fake.name"
        }
    }

    applicationVariants.all {
        variant ->
            if (variant.buildType.name == "release"&& variant.productFlavors[0].name.equals("novotek"))
                variant.outputs.all {
                    outputFileName = "Novotek.apk"
                }
            if (variant.buildType.name == "release"&& variant.productFlavors[0].name.equals("avix"))
                variant.outputs.all {
                    outputFileName = "Avix.apk"
                }
            if (variant.buildType.name == "release"&& variant.productFlavors[0].name.equals("trade"))
                variant.outputs.all {
                    outputFileName = "Trade.apk"
                }
            if (variant.buildType.name == "market")
                variant.outputs.all {
                    outputFileName = "NapoleonMarketDev4.apk"
                }
    }}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    def fragment_version = "1.4.1"
    def lifecycle_version = "2.5.0-alpha05"

    implementation 'com.android.support:multidex:1.0.3'

    implementation project(':tradebase')

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "androidx.fragment:fragment:$fragment_version"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"

    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    // alternately - if using Java8, use the following instead of lifecycle-compiler
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
}
