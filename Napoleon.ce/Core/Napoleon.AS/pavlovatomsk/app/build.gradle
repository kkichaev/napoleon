apply plugin: 'com.android.application'

android {
    compileSdkVersion 29

    defaultConfig {
        applicationId "com.grsoft.napoleon"
        minSdkVersion 15
        targetSdkVersion 29
        versionCode 20
        versionName "20"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        market {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions.encoding = 'windows-1251'

    lintOptions {
        checkReleaseBuilds false
        //abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'grsoft'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('NAPOLEON_KEY'))
            storePassword 'GrSoftNapoleon'
        }

        market {
            keyAlias 'grnpl'
            keyPassword 'GrSoftNapoleon'
            storeFile file(System.getenv('GRNPL_KEY'))
            storePassword 'GrSoftNapoleon'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }

        market {
            signingConfig signingConfigs.market
        }
    }

    flavorDimensions "version"

    productFlavors{
        pavlova{
            dimension "version"
        }

        leonova{
            dimension "version"
        }
    }


    applicationVariants.all {
        variant ->
            if (variant.buildType.name == "release"&& variant.productFlavors[0].name.equals("pavlova"))
                variant.outputs.all {
                    outputFileName = "PavlovaTomsk.apk"
                }
            if (variant.buildType.name == "release"&& variant.productFlavors[0].name.equals("leonova"))
                variant.outputs.all {
                    outputFileName = "LeonovaKrasnoyarsk.apk"
                }
            if (variant.buildType.name == "market")
                variant.outputs.all {
                    outputFileName = "NapoleonMarketDev4.apk"
                }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':tradebase')

    implementation 'androidx.appcompat:appcompat:1.0.0'

}
