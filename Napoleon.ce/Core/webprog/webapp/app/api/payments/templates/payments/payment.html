<!doctype html>
<html lang="ru">
  <head>
    <title>Страница платежей</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <br/>
      <br/>

      {% if payment %}
      <div class="row justify-content-center">
        <div class="col-4">
          <h2>GRSoft оплата за сервис</h2>          
        </div>
      </div>      
      <br/>

      <br/>
      <div class="row justify-content-center">
        <div class="col-3">
          <h3>Код заказа: {{payment.order_id}}</h3>          
        </div>
      </div>      

      <br/>
      <div class="row justify-content-center">
        <div class="col-3">
          <h3>Услуга: {{payment.text}}</h3>          
        </div>
      </div>      
      <br/>
      
      <div class="row justify-content-center">
        <div class="col-3">
          <h4>Сумма к оплате: {{payment.amount}} {{payment.currency}}</h4>
        </div>
      </div>

      <br/>
      {% if payment.status != 1 %}
      <div class="row justify-content-center">
        <div class="col-3">
          <button type="button" id="payment" class="btn btn-primary">Оплатить</button>
        </div>
      </div>
      {% else %}
      <div class="row justify-content-center">
        <div class="col-3">
          <h4>Заказ уже оплачен.</h4>
        </div>
      </div>
      {% endif %}
      {% else %}
      <div class="row justify-content-center">
        <div class="col-4">
          <h2>Платеж не найден</h2>          
        </div>
      </div>      
      <br/>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script>
      $(function() {
        $('#payment').on('click', function(){
          console.log('test')
          
          url = '{{url_for('api.payments.getPayUrl')}}'
          data = {'amount':{{payment.amount}},
            'order_id': '{{payment.order_id }}' }

          $.ajax({
            url:url,
            method:'POST',
            contentType: "application/json; charset=utf-8",
            data:JSON.stringify(data),
            dataType:'json',
          }).done(function(data){
            if(data.response) {
              console.log(data)
              urlR = data.response.transactionUrl
              window.location.href = urlR
            }
          }).fail(function(data){
            console.log(data)
          })
        })
      });
    </script>
  </body>
</html>
